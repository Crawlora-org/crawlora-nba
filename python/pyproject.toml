[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-nba"
version = "0.1.0"
description = "Crawlora NBA API client with 70 endpoints for games, standings, player and team statistics, play-by-play, and dashboards"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "nba", "nba-api", "nba-scraper", "nba-data", "nba-games", "nba-standings", "nba-player-team-statistics", "nba-play-play", "nba-dashboards"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=nba-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=nba-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-nba"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_nba"]

[tool.setuptools.package-data]
"crawlora_nba" = ["py.typed", "*.pyi"]
